services:
  api:
    build: .
    container_name: cuba-usd-rate-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - SCRAPE_INTERVAL_MINUTES=${SCRAPE_INTERVAL_MINUTES:-480}
      - DATABASE_URL=postgresql://qvai:${POSTGRES_PASSWORD}@postgres:5432/qvai
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cuba-usd-rate-postgres
    environment:
      - POSTGRES_USER=qvai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=qvai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qvai -d qvai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not published to the host - only reachable from the api service on
    # the compose network, keeps the bot token / API key / conversations
    # off the public internet even if something is misconfigured.

volumes:
  pgdata:
