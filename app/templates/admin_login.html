<script>(function () {
  try {
    var saved = localStorage.getItem("cuba-usd-api-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();</script>
<title>Login · qvai admin</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<link rel="stylesheet" href="/static/style.css?v={{ static_version }}" />
<link rel="stylesheet" href="/static/admin.css?v={{ admin_static_version }}" />

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <h1>🔒 qvai admin</h1>
    {% if error %}
    <div class="admin-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login" class="admin-form">
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autofocus />
      </div>
      <button type="submit" class="admin-btn" style="width: 100%; justify-content: center;">Entrar</button>
    </form>
  </div>
</div>
